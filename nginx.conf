# Frontend Nginx config — serves Vue SPA + proxies API to backend instance
# BACKEND_URL is substituted at container startup via envsubst

upstream backend_api {
    server ${BACKEND_URL};
}

# Preserve the original protocol across proxy hops. The public host nginx terminates TLS and
# sends X-Forwarded-Proto: https; this container is reached over plain http, so $scheme here is
# "http". Forwarding $scheme would clobber the real https and make Django (SECURE_SSL_REDIRECT)
# 301-loop. Forward the incoming header instead, falling back to $scheme only for direct access.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ── Shared-conversation link previews ──────────────────────────────────────────────────────────
# /share/<token> is a SPA route, and social crawlers don't execute JS — so a pasted share link
# would unfurl as an empty card on X, LinkedIn, Slack, WhatsApp and the rest. Crawler user-agents
# hitting that path are proxied to the backend's server-rendered Open Graph page (/s/<token>)
# instead; humans still get the SPA from the same URL. One public link, correct for both.
map $http_user_agent $ua_is_crawler {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|Twitterbot|LinkedInBot|Slackbot|SkypeUriPreview|WhatsApp|TelegramBot|Discordbot|redditbot|Pinterest|vkShare|Googlebot|bingbot|BingPreview|Applebot|DuckDuckBot|YandexBot|Baiduspider|embedly|Iframely|quora link preview|nuzzel|outbrain|Mastodon|Threads|Bluesky)" 1;
}
# The backend's OG page bounces humans back with ?app=1. Honour that as an explicit "serve the SPA"
# override, so a browser wrongly matched by the pattern above can never ping-pong between the two.
map "$ua_is_crawler$arg_app" $serve_share_og {
    default 0;
    "1"     1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── API requests → backend instance ──
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── WebSocket → backend instance ──
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Auth endpoints → backend instance ──
    location /auth/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Admin → backend instance ──
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Shared-conversation Open Graph page → backend instance ──
    # The deploy is same-origin (FRONTEND_URL == BACKEND_URL == aadml.com), so without this the SPA
    # catch-all would swallow /s/<token> and Django would never see it. The normal crawler path is
    # the /share/<token> rule further down; this keeps the direct URL working too.
    location ^~ /s/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Static/media from backend ──
    # `^~` so these prefix locations WIN over the `~* \.(png|jpg|…)$` asset regex below (in nginx a regex
    # location beats a plain prefix). Without it, a generated image at /media/…/gen_x.png was captured by
    # that regex and served from the local SPA root via `try_files $uri =404` → 404, instead of proxying
    # to the backend that actually holds the file.
    location ^~ /static/ {
        proxy_pass http://backend_api;
    }

    location ^~ /media/ {
        proxy_pass http://backend_api;
    }

    # ── Container liveness probe (docker compose healthcheck / deploy.sh) ──
    # Deliberately local: it proves this container is serving, without depending on
    # the backend being reachable, so a backend blip can't roll back a good frontend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Shared conversation: SPA for humans, Open Graph page for crawlers ──
    # Declared before the catch-all `location /` so it wins for this path. `rewrite ... last` inside
    # `if` is the one form of `if` that is safe in a location block (it triggers a plain internal
    # redirect), which is why the proxying itself lives in the internal location below.
    location ~ ^/share/(?<share_token>[A-Za-z0-9_-]+)/?$ {
        if ($serve_share_og) {
            rewrite ^ /__share_og/$share_token last;
        }
        try_files $uri /index.html;
    }

    location ~ ^/__share_og/(?<og_token>[A-Za-z0-9_-]+)$ {
        internal;                       # reachable only via the rewrite above, never from outside
        proxy_pass http://backend_api/s/$og_token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Vue SPA — serve index.html for all frontend routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
