# Frontend Nginx config — serves Vue SPA + proxies API to backend instance
# BACKEND_URL is substituted at container startup via envsubst

upstream backend_api {
    server ${BACKEND_URL};
}

# Preserve the original protocol across proxy hops. The public host nginx terminates TLS and
# sends X-Forwarded-Proto: https; this container is reached over plain http, so $scheme here is
# "http". Forwarding $scheme would clobber the real https and make Django (SECURE_SSL_REDIRECT)
# 301-loop. Forward the incoming header instead, falling back to $scheme only for direct access.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# ── Shared-conversation link previews ──────────────────────────────────────────────────────────
# /share/<token> is a SPA route, and social crawlers don't execute JS — so a pasted share link
# would unfurl as an empty card on X, LinkedIn, Slack, WhatsApp and the rest. Crawler user-agents
# hitting that path are proxied to the backend's server-rendered Open Graph page (/s/<token>)
# instead; humans still get the SPA from the same URL. One public link, correct for both.
map $http_user_agent $ua_is_crawler {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|Twitterbot|LinkedInBot|Slackbot|SkypeUriPreview|WhatsApp|TelegramBot|Discordbot|redditbot|Pinterest|vkShare|Googlebot|bingbot|BingPreview|Applebot|DuckDuckBot|YandexBot|Baiduspider|embedly|Iframely|quora link preview|nuzzel|outbrain|Mastodon|Threads|Bluesky)" 1;
}
# The backend's OG page bounces humans back with ?app=1. Honour that as an explicit "serve the SPA"
# override, so a browser wrongly matched by the pattern above can never ping-pong between the two.
map "$ua_is_crawler$arg_app" $serve_share_og {
    default 0;
    "1"     1;
}

# The sites allowed to frame /embed/<token>, as the backend answered the auth_request (location /embed/ below).
# Only "'self'" followed by up to 20 plain http(s) site entries passes; anything else (no answer, an empty
# header, a ';' that would add a directive) is "'self'": the page then frames only on aadml.com, never anywhere.
map $embed_sites $embed_frame_ancestors {
    default "'self'";
    "~^'self'( https?://[A-Za-z0-9.*:-]+){0,20}$" $embed_sites;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Security headers: ON THE PAGES THIS SERVER SERVES, NOT ON WHAT IT PROXIES (security audit M-11).
    # They used to be set here, at server level, so every proxied backend response (/api/, /ws/, /media/,
    # ...) carried this server's set ON TOP OF the backend's: two X-Frame-Options (DENY and SAMEORIGIN),
    # which a browser may treat as none, and two CSPs, the backend's per-page one (a sandboxed document)
    # included. One owner per response: the backend for what it answers, the locations below (/, index.html,
    # static assets) for the app's own files. Audit A6 is unchanged: HSTS, and a CSP limited to what
    # cannot break the app (no plugins, no <base> hijack).

    # Gzip
    #
    # `gzip_http_version 1.0` and `gzip_proxied any` are what make it actually happen. Every request reaches
    # this container through the host nginx, which proxies with HTTP/1.0 (nginx's default) — and nginx only
    # compresses HTTP/1.1 requests by default. Measured 2026-10-20: ConnectorsPage.js went out as 127,887 raw
    # bytes and API JSON uncompressed too, so a first visit to a page waited ~2 s on downloads over a ~280 ms
    # round trip. `gzip_vary` keeps caches honest about the encoding.
    gzip on;
    gzip_http_version 1.0;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── OAuth discovery → backend instance ──────────────────────────────────────────────────────
    # The MCP control plane is published at THIS origin (https://aadml.com/api/mcp/v1), so an OAuth
    # client looks for its discovery documents at THIS origin's root: RFC 9728
    # (/.well-known/oauth-protected-resource) and RFC 8414 (/.well-known/oauth-authorization-server)
    # both define those paths relative to the origin, not to the resource path.
    #
    # Without this block they fall through to the SPA catch-all below and return `200 text/html`.
    # That is worse than a 404: the client gets a SUCCESSFUL response that is not a discovery
    # document, and reports "this server isn't publishing a discovery document / may not support
    # OAuth" — with no way to tell that the document exists one hop away.
    #
    # Prefix match on `/.well-known/oauth-` deliberately, not all of `/.well-known/`: ACME renewal
    # (`/.well-known/acme-challenge/`) and any future static well-known file must keep being served
    # from here rather than being proxied to Django, which would 404 them and could break cert issuance.
    #
    # `$host` matches the convention in every other block. That is correct on the standard ports this
    # is deployed on (it equals `aadml.com`), and Django echoes it back as the OAuth `issuer`, which a
    # client checks against the URL it fetched from. If this origin is ever served on a NON-default
    # port, `$host` drops that port, the issuer stops matching, and OAuth discovery fails — switch
    # every `Host` header in this file to `$http_host` at that point, not just this one.
    location /.well-known/oauth- {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── API requests → backend instance ──
    # `^~` so an API path ending in an image extension still reaches the backend: a plain prefix loses to the
    # `~* \.(png|…|svg)$` asset regex below, which answered /api/partner/connector-logos/…/x.svg with a 404
    # from the SPA root (ADM-1108, 2026-10-29). Same trap as /static/ and /media/.
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── WebSocket → backend instance ──
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Auth endpoints → backend instance ──
    location /auth/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Training Data app (Django templates, session auth) → backend instance ──
    # training_models_data renders its own pages; without this the SPA catch-all would serve index.html.
    location /training-data/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 20m;
    }

    # ── Admin → backend instance ──
    location /admin/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Shared-conversation Open Graph page → backend instance ──
    # The deploy is same-origin (FRONTEND_URL == BACKEND_URL == aadml.com), so without this the SPA
    # catch-all would swallow /s/<token> and Django would never see it. The normal crawler path is
    # the /share/<token> rule further down; this keeps the direct URL working too.
    location ^~ /s/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Static/media from backend ──
    # `^~` so these prefix locations WIN over the `~* \.(png|jpg|…)$` asset regex below (in nginx a regex
    # location beats a plain prefix). Without it, a generated image at /media/…/gen_x.png was captured by
    # that regex and served from the local SPA root via `try_files $uri =404` → 404, instead of proxying
    # to the backend that actually holds the file.
    location ^~ /static/ {
        proxy_pass http://backend_api;
    }

    location ^~ /media/ {
        proxy_pass http://backend_api;
    }

    # The forced-download twin of /media/ (the backend answers with Content-Disposition: attachment).
    # Without its own block the path ends in .png/.jpg, falls into the static-asset regex below and is
    # answered 404 from the SPA root, so every image's download button was a dead link (ADM-486).
    #
    # It passes the real Host, unlike /media/ above. Without it nginx sends `Host: backend_api`, and
    # Django refuses a host name with an underscore before it reads ALLOWED_HOSTS, so the route
    # answered 400. (/media/ survives only because the backend's own nginx rewrites the Host on that
    # one path; everything else reaches Django through `location /`, which forwards it as sent.)
    location ^~ /media-dl/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Container liveness probe (docker compose healthcheck / deploy.sh) ──
    # Deliberately local: it proves this container is serving, without depending on
    # the backend being reachable, so a backend blip can't roll back a good frontend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Shared conversation: SPA for humans, Open Graph page for crawlers ──
    # Declared before the catch-all `location /` so it wins for this path. `rewrite ... last` inside
    # `if` is the one form of `if` that is safe in a location block (it triggers a plain internal
    # redirect), which is why the proxying itself lives in the internal location below.
    location ~ ^/share/(?<share_token>[A-Za-z0-9_-]+)/?$ {
        if ($serve_share_og) {
            rewrite ^ /__share_og/$share_token last;
        }
        try_files $uri /app.html;
    }

    location ~ ^/__share_og/(?<og_token>[A-Za-z0-9_-]+)$ {
        internal;                       # reachable only via the rewrite above, never from outside
        proxy_pass http://backend_api/s/$og_token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ── Vue SPA — app.html (the empty shell) for every frontend route, a prerendered page for five ──
    # scripts/prerender.mjs writes the public pages with their HTML in them (ADM-1079): / is index.html,
    # /login, /signup, /features and /pricing are <route>/index.html (served by `location /` below). The
    # shell Vite built is kept as app.html, the answer for every other route.
    # These pages must never be cached without revalidation: they are the only non-hashed files, and
    # heuristic caching (no Cache-Control + a days-old Last-Modified) let browsers keep serving a
    # stale app for hours after a deploy — new pages "missing" in production until a hard refresh.
    # no-cache = store but revalidate every time; the ETag makes that a cheap 304.
    # add_header in a location suppresses the server-level headers, so the security set is re-declared.
    location ~ ^/(index|app)\.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
    }

    # ── Training Data: its own page (training-data/index.html), built into /dashboard/training-data/ ──
    # `^~` so neither the SPA catch-all nor the asset regex below takes these paths. Any path without a file
    # gets ITS index.html (the page routes by #hash), never the AADML one. Same rules as the AADML app:
    # index.html revalidated every time, hashed assets cached for a year. The old Django pages at
    # /training-data/ are unaffected.
    location ^~ /dashboard/training-data/ {
        location ~* ^/dashboard/training-data/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
            # A tab opened before the last deploy asks for the previous release's files: see /assets/ below.
            try_files $uri @prev_release_assets;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
        try_files $uri /dashboard/training-data/index.html;
    }
    location = /dashboard/training-data {
        # Relative Location: this container is reached over plain http behind the TLS host nginx, so an
        # absolute one would send the browser to http://.
        absolute_redirect off;
        return 301 /dashboard/training-data/;
    }

    # The webchat embed is the one page OTHER sites frame: public/webchat/widget.js puts /embed/<token> in an
    # iframe on the customer's own site. Every other page stays DENY.
    # WHICH sites may frame it is the agent's own list (Deploy settings > Allowed websites): before serving the
    # page, nginx asks the backend for that list (auth_request) and sends it as frame-ancestors, with 'self' so
    # the Live preview in Deploy settings works. It used to be `frame-ancestors *` (2026-10-15), which let any
    # site show an agent's chat and spend its budget. The list is checked when it is saved AND again by the
    # $embed_frame_ancestors map: an empty, missing or odd value becomes 'self' (fail closed, never `*`).
    # `try_files /app.html` serves the file in THIS location; falling through to the app.html location would bring
    # back its DENY.
    location ^~ /embed/ {
        auth_request /__embed_frame_ancestors;
        auth_request_set $embed_sites $upstream_http_x_frame_ancestors;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "frame-ancestors $embed_frame_ancestors; object-src 'none'; base-uri 'self'" always;
        try_files /app.html =404;
    }

    # The subrequest behind /embed/: the backend answers 204 with X-Frame-Ancestors for the token in the
    # original path (X-Original-URI). Internal only: a browser cannot call it.
    location = /__embed_frame_ancestors {
        internal;
        proxy_pass http://backend_api/api/public/embed-frame-ancestors/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 10s;
    }

    location / {
        # Revalidated like app.html: this location answers with a prerendered page (`$uri/index.html`).
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
        # No `$uri/`: a route of the app can share its name with a folder of the build. The Training Data
        # page is built into dashboard/training-data/, so `/dashboard` matched the folder `dashboard/`:
        # nginx redirected to `http://…/dashboard/` and then refused to list it — 403 on every fresh load
        # or refresh of the home page (2026-10-19). Every route is the app's; files are matched by `$uri`, and a
        # prerendered page by `$uri/index.html`, which is a file test: no redirect, no listing.
        try_files $uri $uri/index.html /app.html;
    }

    # ── Hashed build output: this release's file, else the PREVIOUS release's (F-C1, ADM-1073) ──
    # A tab still open on the old index.html asks for old hashed chunks the moment it opens a lazy route, and
    # those names no longer exist in this image: before, that was a 404 and a blank page or a forced reload.
    # deploy.sh copies the outgoing container's assets/ (and the Training Data page's) to the host and the
    # compose file mounts that copy read-only at /usr/share/nginx/prev-release, so one deploy back still
    # answers. One release only: each deploy replaces the copy. With no copy mounted (first deploy, or an
    # older compose file) the fallback is the same 404 as before.
    # `^~` so this wins over the extension regex below; everything Vite writes to assets/ is content-hashed,
    # so all of it is cached as immutable.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
        try_files $uri @prev_release_assets;
    }

    # Same path, one release back. Named, so it cannot be requested directly; read-only mount.
    location @prev_release_assets {
        root /usr/share/nginx/prev-release;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header here suppresses the server-level set, so the security headers are repeated (audit A6).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'" always;
        try_files $uri =404;
    }
}
