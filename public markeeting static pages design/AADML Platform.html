    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // DOMParser/replaceWith are inert per spec — re-create each with

:var(--shadow-sm);z-index:3}.bnode small{font:800 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.bnode b{font-size:13px;display:block;margin:8px 0 3px}.bnode span{font-size:10px;color:var(--muted)}.bwire{position:absolute;height:2px;background:#9db3aa;transform-origin:left center;z-index:1}.bnode.run{box-shadow:0 0 0 5px var(--blue-2),var(--shadow-sm);border-color:var(--blue)}\n.builder-feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.builder-feature{border:1px solid var(--line);border-radius:23px;padding:25px;background:#fff;min-height:230px}.builder-feature h3{font-size:18px;margin:28px 0 9px}.builder-feature p{font-size:12px;color:var(--muted);line-height:1.65}.builder-feature .num{font:800 10px var(--mono);color:var(--blue)}\n@media(max-width:1050px){.page-hero-grid,.section-head-wide,.runtime-grid,.event-grid,.feature-block,.feature-block.reverse,.builder-grid{grid-template-columns:1fr}.feature-block.reverse .feature-copy,.feature-block.reverse .feature-ui{order:initial}.lifecycle,.surfaces-grid,.deployment-grid{grid-template-columns:repeat(2,1fr)}.page-hero h1{max-width:13ch}.diagram-card{min-height:auto}.feature-hero-mosaic{grid-template-columns:1fr}.mosaic-main{grid-row:auto}.group-title{align-items:start;flex-direction:column}.browser-body{grid-template-columns:1fr}.automation-log{border-left:0;border-top:1px solid var(--line)}}\n@media(max-width:720px){.shell{width:min(100% - 28px,1440px)}.page-hero{padding-top:58px}.page-hero h1,.builder-grid h1{font-size:56px}.nav-links{display:none}.nav-actions .text-link{display:none}.lifecycle,.surfaces-grid,.deployment-grid,.builder-feature-grid{grid-template-columns:1fr}.layer-row{grid-template-columns:1fr}.layer-name{padding-bottom:10px}.page-hero-grid{gap:34px}.feature-block{padding:38px 0}.feature-copy h3{font-size:39px}.code-window{grid-template-columns:120px 1fr}.phone-log{position:static;width:auto;margin:14px}.section-head-wide{gap:24px}.event-copy{padding:30px}.event-copy h2{font-size:46px}.builder-workspace{height:700px}.bnode{width:145px}.media-steps{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:1fr}.stack-row{grid-template-columns:1fr}.diagram-card{padding:15px}}\n\n.phone-stage{position:relative}\n<\u002Fstyle><\u002Fhead><body class=\"page-body\">\n<div class=\"top-note\"><div class=\"shell\"><span>AADML<\u002Fspan> · governed execution for consequential work<\u002Fdiv><\u002Fdiv>\n<header>\n  <div class=\"shell nav\">\n    <a class=\"brand\" href=\"index.html#top\"><span class=\"brand-mark\"><i><\u002Fi><\u002Fspan>AADML<\u002Fa>\n    <nav class=\"nav-links\">\n      <a href=\"platform.html\" class=\"page-nav-active\">Platform<\u002Fa>\n      <a href=\"features.html\" class=\"\">Features<\u002Fa>\n      <a href=\"docs.html\" class=\"\">Docs<\u002Fa>\n      <a href=\"pricing.html\" class=\"\">Pricing<\u002Fa>\n      <a href=\"blog.html\" class=\"\">Blog<\u002Fa>\n    <\u002Fnav>\n    <div class=\"nav-actions\"><a class=\"text-link\" href=\"features.html#developers\">Developers<\u002Fa><a class=\"btn\" href=\"#contact\">Enter the platform <span>↗<\u002Fspan><\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n<main class=\"page-main\">\n<section class=\"page-hero\" id=\"top\">\n  <div class=\"shell page-hero-grid\">\n    <div data-reveal=\"\"><div class=\"section-kicker\">Platform architecture<\u002Fdiv><h1>A general execution layer for <em>intelligent systems.<\u002Fem><\u002Fh1><p>AADML joins agent intelligence to durable execution: persistent workspaces, event-driven jobs, governed tools, human authority, evidence, and infrastructure that can operate from one developer machine to a laboratory, enterprise, or public institution.<\u002Fp><div class=\"hero-actions\"><a class=\"btn\" href=\"#architecture\">Explore the architecture <span>→<\u002Fspan><\u002Fa><a class=\"btn secondary\" href=\"features.html\">View every feature<\u002Fa><\u002Fdiv><div class=\"subnav\"><a href=\"#lifecycle\">Lifecycle<\u002Fa><a href=\"#runtime\">Runtime<\u002Fa><a href=\"#execution-surfaces\">Execution surfaces<\u002Fa><a href=\"#event-fabric\">Event fabric<\u002Fa><a href=\"#deployment\">Deployment<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <div class=\"diagram-card\" data-reveal=\"\">\n      <div class=\"platform-stack\">\n        <div class=\"stack-row\"><b>Interfaces<\u002Fb><span>Chat · API · SDKs · Webhooks · Slack · WhatsApp · Embedded applications<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Orchestration<\u002Fb><span>Roles · Plans · Tasks · Multi-agent coordination · Evaluations · Policies<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Execution<\u002Fb><span>Jobs · Queues · Schedulers · Retries · Checkpoints · Long-running state<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Workspaces<\u002Fb><span>Files · Terminal · Browser · Code · Artifacts · Daytona · Remote machines<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Knowledge<\u002Fb><span>Documents · RAG · Databases · Structured memory · Task history · Citations<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Tools<\u002Fb><span>MCP · APIs · Python · Shell · SaaS · Android · Internal systems<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Event fabric<\u002Fb><span>Signals · Redis queues · Streams · Webhooks · Cron · Dead-letter recovery<\u002Fspan><\u002Fdiv>\n        <div class=\"stack-row\"><b>Governance<\u002Fb><span>RBAC · Credentials · Approvals · Budgets · Audit logs · Retention · Isolation<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv><div class=\"stack-caption\">One operating layer · from intelligence to accountable action<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"content-section\" id=\"lifecycle\"><div class=\"shell\"><div class=\"section-head-wide\" data-reveal=\"\"><div><div class=\"section-kicker\">Execution model<\u002Fdiv><h2>One system for the complete agent lifecycle.<\u002Fh2><\u002Fdiv><p>Define, execute, supervise, inspect, and improve. The platform keeps the mission, workspace, evidence, policies, and operational state together instead of scattering them across unrelated tools.<\u002Fp><\u002Fdiv><div class=\"lifecycle\">\n  <article class=\"life-card\" style=\"--tone:var(--blue)\" data-reveal=\"\"><small>01 · DEFINE<\u002Fsmall><h3>Give the system a mission<\u002Fh3><p>Set roles, objectives, models, tools, knowledge, permissions, budget, and operating limits.<\u002Fp><\u002Farticle>\n  <article class=\"life-card\" style=\"--tone:var(--green)\" data-reveal=\"\"><small>02 · EXECUTE<\u002Fsmall><h3>Work inside real environments<\u002Fh3><p>Agents plan and act in persistent workspaces rather than producing one disposable response.<\u002Fp><\u002Farticle>\n  <article class=\"life-card\" style=\"--tone:var(--red)\" data-reveal=\"\"><small>03 · SUPERVISE<\u002Fsmall><h3>Keep people in authority<\u002Fh3><p>Review activity, approve sensitive actions, intervene, pause, or allow policy-approved work to continue.<\u002Fp><\u002Farticle>\n  <article class=\"life-card\" style=\"--tone:var(--violet)\" data-reveal=\"\"><small>04 · INSPECT<\u002Fsmall><h3>See the evidence<\u002Fh3><p>Inspect tool calls, files, browser actions, device sessions, costs, state changes, errors, and outputs.<\u002Fp><\u002Farticle>\n  <article class=\"life-card\" style=\"--tone:var(--amber)\" data-reveal=\"\"><small>05 · IMPROVE<\u002Fsmall><h3>Turn runs into capability<\u002Fh3><p>Evaluate results, find failure patterns, update policies, and reuse successful execution paths.<\u002Fp><\u002Farticle>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"content-section soft\" id=\"architecture\"><div class=\"shell\"><div class=\"section-head-wide\" data-reveal=\"\"><div><div class=\"section-kicker\">Platform layers<\u002Fdiv><h2>Every layer required to move from intent to outcome.<\u002Fh2><\u002Fdiv><p>AADML is not a model wrapper. It is a control and execution plane that makes models useful inside institutions, production systems, scientific work, public services, and physical devices.<\u002Fp><\u002Fdiv><div class=\"layer-table\" data-reveal=\"\">\n  <div class=\"layer-row\" id=\"interfaces\"><div class=\"layer-name\">Interfaces<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Web console<\u002Fspan><span class=\"cap\">REST API<\u002Fspan><span class=\"cap\">SDKs<\u002Fspan><span class=\"cap\">CLI<\u002Fspan><span class=\"cap\">Webhooks<\u002Fspan><span class=\"cap\">Slack<\u002Fspan><span class=\"cap\">WhatsApp<\u002Fspan><span class=\"cap\">Custom applications<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Agent orchestration<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Goals &amp; planning<\u002Fspan><span class=\"cap\">Agent Studio<\u002Fspan><span class=\"cap\">Multi-agent tasks<\u002Fspan><span class=\"cap\">Policies<\u002Fspan><span class=\"cap\">Evaluations<\u002Fspan><span class=\"cap\">Routing<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Execution runtime<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Long-running jobs<\u002Fspan><span class=\"cap\">Queues<\u002Fspan><span class=\"cap\">Retries<\u002Fspan><span class=\"cap\">Schedulers<\u002Fspan><span class=\"cap\">State<\u002Fspan><span class=\"cap\">Checkpoints<\u002Fspan><span class=\"cap\">Recovery<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Workspaces<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Persistent files<\u002Fspan><span class=\"cap\">Terminal<\u002Fspan><span class=\"cap\">Browser<\u002Fspan><span class=\"cap\">Daytona<\u002Fspan><span class=\"cap\">Artifacts<\u002Fspan><span class=\"cap\">Remote Runner<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Knowledge &amp; memory<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Cited RAG<\u002Fspan><span class=\"cap\">Documents<\u002Fspan><span class=\"cap\">Website crawls<\u002Fspan><span class=\"cap\">Structured memory<\u002Fspan><span class=\"cap\">Vector stores<\u002Fspan><span class=\"cap\">Task history<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Tools &amp; systems<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">MCP registry<\u002Fspan><span class=\"cap\">REST / GraphQL<\u002Fspan><span class=\"cap\">Databases<\u002Fspan><span class=\"cap\">Python<\u002Fspan><span class=\"cap\">Shell<\u002Fspan><span class=\"cap\">Browser automation<\u002Fspan><span class=\"cap\">Android / ADB / Appium<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Event infrastructure<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">Signals<\u002Fspan><span class=\"cap\">Redis<\u002Fspan><span class=\"cap\">Streams<\u002Fspan><span class=\"cap\">Locks<\u002Fspan><span class=\"cap\">Rate limits<\u002Fspan><span class=\"cap\">Webhooks<\u002Fspan><span class=\"cap\">Cron schedules<\u002Fspan><span class=\"cap\">Dead-letter alerts<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <div class=\"layer-row\"><div class=\"layer-name\">Governance<\u002Fdiv><div class=\"layer-caps\"><span class=\"cap strong\">RBAC<\u002Fspan><span class=\"cap\">Credential vault<\u002Fspan><span class=\"cap\">Approval gates<\u002Fspan><span class=\"cap\">Budgets<\u002Fspan><span class=\"cap\">Audit logs<\u002Fspan><span class=\"cap\">Retention<\u002Fspan><span class=\"cap\">Tenant isolation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"content-section\" id=\"runtime\"><div class=\"shell\"><div class=\"section-head-wide\" data-reveal=\"\"><div><div class=\"section-kicker\">Runtime<\u002Fdiv><h2>Work does not always finish in one prompt.<\u002Fh2><\u002Fdiv><p>Operations can span hundreds of steps, multiple systems, waiting periods, approvals, retries, and changing conditions. AADML preserves the mission and state throughout the entire run.<\u002Fp><\u002Fdiv><div class=\"runtime-grid\"><div class=\"runtime-board\" data-reveal=\"\"><div class=\"runtime-top\"><span>mission · laboratory-quality-review<\u002Fspan><span>state persisted<\u002Fspan><\u002Fdiv>\n  <div class=\"job-row\"><div class=\"job-icon\">1<\u002Fdiv><div><b>Collect instrument output<\u002Fb><span>3 files · checksums verified<\u002Fspan><\u002Fdiv><div class=\"job-state\">complete<\u002Fdiv><\u002Fdiv>\n  <div class=\"job-row\"><div class=\"job-icon\">2<\u002Fdiv><div><b>Validate protocol and sample metadata<\u002Fb><span>policy set · lab-qms-v4<\u002Fspan><\u002Fdiv><div class=\"job-state\">complete<\u002Fdiv><\u002Fdiv>\n  <div class=\"job-row active\"><div class=\"job-icon\">3<\u002Fdiv><div><b>Run anomaly analysis<\u002Fb><span>Daytona workspace · Python environment<\u002Fspan><\u002Fdiv><div class=\"job-state\">running<\u002Fdiv><\u002Fdiv>\n  <div class=\"job-row\"><div class=\"job-icon\">4<\u002Fdiv><div><b>Wait for scientist review<\u002Fb><span>checkpoint retained for 72 hours<\u002Fspan><\u002Fdiv><div class=\"job-state\">waiting<\u002Fdiv><\u002Fdiv>\n  <div class=\"job-row\"><div class=\"job-icon\">5<\u002Fdiv><div><b>Publish signed evidence package<\u002Fb><span>immutable artifact + notification webhook<\u002Fspan><\u002Fdiv><div class=\"job-state\">pending<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><div class=\"runtime-side\"><article class=\"info-card\" data-reveal=\"\"><div class=\"icon\">∞<\u002Fdiv><h3>Durable missions<\u002Fh3><p>Pause, resume, retry, schedule, recover, split work into subordinate jobs, and preserve intermediate artifacts without losing operational context.<\u002Fp><ul><li>Wait for events without losing state<\u002Fli><li>Resume after human approval<\u002Fli><li>Recover from model and tool failures<\u002Fli><\u002Ful><\u002Farticle><article class=\"info-card\" data-reveal=\"\"><div class=\"icon\">§<\u002Fdiv><h3>Policy at execution time<\u002Fh3><p>Permissions, approval requirements, spend limits, and data boundaries are evaluated when the action happens—not merely described in a prompt.<\u002Fp><ul><li>Per-tool allow · ask · deny<\u002Fli><li>Budget caps and read-only modes<\u002Fli><li>Escalation when confidence is insufficient<\u002Fli><\u002Ful><\u002Farticle><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"content-section soft\" id=\"execution-surfaces\"><div class=\"shell\"><div class=\"section-head-wide\" data-reveal=\"\"><div><div class=\"section-kicker\">Execution surfaces<\u002Fdiv><h2>Agents work where the work lives.<\u002Fh2><\u002Fdiv><p>Web, mobile, code, private infrastructure, and internal systems become governed execution environments with isolation, recordings, artifacts, and human checkpoints.<\u002Fp><\u002Fdiv><div class=\"surfaces-grid\">\n  <article class=\"surface\" style=\"--tone:var(--blue)\" data-reveal=\"\"><div class=\"tag\">Browser automation<\u002Fdiv><h3>Authenticated web operations<\u002Fh3><p>Controlled sessions for research, portals, forms, testing, extraction, downloads, and external submissions.<\u002Fp><ul><li>DOM, screenshot, network, and download tools<\u002Fli><li>Multi-tab navigation and file uploads<\u002Fli><li>Approval gates before consequential submissions<\u002Fli><\u002Ful><\u002Farticle>\n  <article class=\"surface\" style=\"--tone:var(--violet)\" data-reveal=\"\"><div class=\"tag\">Android device tools<\u002Fdiv><h3>Operate real and virtual devices<\u002Fh3><p>Run mobile workflows through ADB, Appium, accessibility, emulators, and device farms.<\u002Fp><ul><li>Tap, type, swipe, install, launch, inspect<\u002Fli><li>Device assignment and session isolation<\u002Fli><li>Logs, recordings, artifacts, and checkpoints<\u002Fli><\u002Ful><\u002Farticle>\n  <article class=\"surface\" style=\"--tone:var(--green)\" data-reveal=\"\"><div class=\"tag\">Daytona workspaces<\u002Fdiv><h3>Reproducible coding environments<\u002Fh3><p>Fast, isolated sandboxes with repositories, terminals, dependencies, previews, snapshots, and lifecycle control.<\u002Fp><ul><li>Clone, index, edit, test, and review<\u002Fli><li>Hunk-level diff acceptance<\u002Fli><li>Export to pull request—not directly to main<\u002Fli><\u002Ful><\u002Farticle>\n  <article class=\"surface\" style=\"--tone:var(--red)\" data-reveal=\"\"><div class=\"tag\">Remote Runner<\u002Fdiv><h3>Reach private environments safely<\u002Fh3><p>Connect laptops, servers, VMs, laboratories, and private networks while keeping commands permissioned and auditable.<\u002Fp><ul><li>mTLS connection and scoped credentials<\u002Fli><li>Allow or deny each command<\u002Fli><li>Operate internal tools and local datasets<\u002Fli><\u002Ful><\u002Farticle>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"content-section\" id=\"event-fabric\"><div class=\"shell\"><div class=\"event-grid\"><div class=\"event-copy\" data-reveal=\"\"><div class=\"section-kicker\" style=\"color:#9ed8c0\">Event fabric<\u002Fdiv><h2>Signals wake agents. <strong>Redis keeps work moving.<\u002Fstrong><\u002Fh2><p>Activity across connected systems becomes normalized signals that start, wake, route, or escalate workflows. Redis-backed queues, streams, locks, caches, rate limits, and checkpoints keep long-running work coordinated.<\u002Fp><div class=\"subnav\"><a style=\"color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)\" href=\"features.html#signals\">Signals &amp; schedules<\u002Fa><a style=\"color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)\" href=\"workflow-builder.html\">Workflow Builder<\u002Fa><\u002Fdiv><\u002Fdiv><div class=\"event-board\" data-reveal=\"\">\n  <div class=\"runtime-top\"><span>live signal stream<\u002Fspan><span style=\"color:var(--green)\">connected<\u002Fspan><\u002Fdiv>\n  <div class=\"signal-row\"><div class=\"signal-time\">10:42:12<\u002Fdiv><div><b>lead.intent.detected<\u002Fb><span>Lead exceeded institutional qualification threshold<\u002Fspan><\u002Fdiv><div class=\"signal-state\">routed<\u002Fdiv><\u002Fdiv>\n  <div class=\"signal-row\"><div class=\"signal-time\">10:42:18<\u002Fdiv><div><b>payment.failed<\u002Fb><span>Recovery workflow started from Stripe webhook<\u002Fspan><\u002Fdiv><div class=\"signal-state\">started<\u002Fdiv><\u002Fdiv>\n  <div class=\"signal-row\"><div class=\"signal-time\">10:42:24<\u002Fdiv><div><b>android.device.available<\u002Fb><span>Device assigned to a waiting automation run<\u002Fspan><\u002Fdiv><div class=\"signal-state\">resumed<\u002Fdiv><\u002Fdiv>\n  <div class=\"signal-row\"><div class=\"signal-time\">10:42:31<\u002Fdiv><div><b>workspace.test.failed<\u002Fb><span>Daytona emitted diagnostic artifact<\u002Fspan><\u002Fdiv><div class=\"signal-state\">escalated<\u002Fdiv><\u002Fdiv>\n  <div class=\"signal-row\"><div class=\"signal-time\">10:42:36<\u002Fdiv><div><b>approval.granted<\u002Fb><span>Deployment resumed from durable checkpoint<\u002Fspan><\u002Fdiv><div class=\"signal-state\">continued<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"content-section soft\" id=\"deployment\"><div class=\"shell\"><div class=\"section-head-wide\" data-reveal=\"\"><div><div class=\"section-kicker\">Deployment<\u002Fdiv><h2>One execution model, wherever authority and data must remain.<\u002Fh2><\u002Fdiv><p>Deploy in the shared cloud, a dedicated environment, your VPC, on premises, or behind a private-network runner. The operating model remains consistent as the institution expands.<\u002Fp><\u002Fdiv><div class=\"deployment-grid\">\n  <article class=\"deploy-card\" style=\"--tone:var(--blue-2)\" data-reveal=\"\"><div class=\"mark\">☁<\u002Fdiv><h3>Managed cloud<\u002Fh3><p>Start quickly with managed infrastructure, elastic execution, observability, and platform updates.<\u002Fp><\u002Farticle>\n  <article class=\"deploy-card\" style=\"--tone:var(--green-2)\" data-reveal=\"\"><div class=\"mark\">◇<\u002Fdiv><h3>Dedicated environment<\u002Fh3><p>Isolated compute, data, networking, and service boundaries for enterprise workloads.<\u002Fp><\u002Farticle>\n  <article class=\"deploy-card\" style=\"--tone:var(--amber-2)\" data-reveal=\"\"><div class=\"mark\">⌂<\u002Fdiv><h3>Private cloud or VPC<\u002Fh3><p>Keep workloads and data inside customer-controlled cloud accounts and network policies.<\u002Fp><\u002Farticle>\n  <article class=\"deploy-card\" style=\"--tone:var(--violet-2)\" data-reveal=\"\"><div class=\"mark\">▣<\u002Fdiv><h3>On-premise &amp; sovereign<\u002Fh3><p>Operate inside institutional or national boundaries with local runners, retention controls, and audit evidence.<\u002Fp><\u002Farticle>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n<section class=\"cta\" id=\"contact\"><div class=\"shell\"><div class=\"cta-panel reveal\"><div><h2>Build the layer between intelligence and the world.<\u002Fh2><\u002Fdiv><div class=\"cta-copy\"><p>Begin with one workflow, one laboratory, one department, or one operating team. Keep the same platform as the system expands.<\u002Fp><div class=\"cta-actions\"><a class=\"btn light\" href=\"features.html\">Explore all features <span>→<\u002Fspan><\u002Fa><a class=\"btn secondary\" style=\"border-color:rgba(255,255,255,.55);color:white\" href=\"mailto:hello@northrays.com\">Talk to North Rays<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<\u002Fmain>\n<footer>\n  <div class=\"shell\">\n    <div class=\"footer-grid\">\n      <div class=\"footer-brand\"><a class=\"brand\" href=\"index.html#top\"><span class=\"brand-mark\"><i><\u002Fi><\u002Fspan>AADML<\u002Fa><p>The governed execution layer for intelligent systems across software, science, public institutions, infrastructure, and the physical world.<\u002Fp><\u002Fdiv>\n      <div><h4>Platform<\u002Fh4><a href=\"platform.html\">Platform overview<\u002Fa><a href=\"features.html\">All features<\u002Fa><a href=\"workflow-builder.html\">Workflow
