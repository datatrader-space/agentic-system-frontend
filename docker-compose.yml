# Frontend Deployment — runs on its own instance.
#
# This file PULLS a prebuilt image. It never builds. Images are built and pushed
# to ECR by .github/workflows/deploy.yml; the host only swaps containers:
#
#   ./deploy.sh <image-tag>          # normal path (login + pull + up + health-gate)
#
# BLUE/GREEN (ADM-1136): two copies of the same container, blue on 127.0.0.1:8002 and green on
# 127.0.0.1:8003. One serves; deploy.sh starts the next release on the other, waits for its healthcheck,
# then stops the old one gracefully. The host nginx sends aadml.com to both ports (see DEPLOY.md), so a
# deploy never leaves nothing answering. Only deploy.sh starts or stops them; never `up -d` both.
#
# To build an image locally instead (dev only, never on the prod host):
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build frontend_blue
#
# Config lives in .deploy.env next to this file (git-ignored) — see DEPLOY.md.

x-frontend: &frontend
  image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-aadml-frontend}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment:
    - BACKEND_URL=${BACKEND_URL:-172.31.6.43:8000}
  volumes:
    # The previous release's hashed assets (F-C1, ADM-1073): deploy.sh copies them out of the outgoing
    # container, and nginx.conf (@prev_release_assets) serves them when this release lacks the file, so a
    # tab opened before the deploy keeps working. Read-only; deploy.sh creates the folder.
    - ./prev-release:/usr/share/nginx/prev-release:ro
  # nginx's graceful stop: it closes its listener (the host nginx moves new requests to the other colour) and
  # finishes the requests it has open, for up to 30 s, before it exits.
  stop_signal: SIGQUIT
  stop_grace_period: 30s
  healthcheck:
    # 127.0.0.1, not localhost: inside the container localhost resolves to ::1
    # first, and nginx `listen 80` binds IPv4 only — busybox wget then gets
    # ECONNREFUSED and the container is permanently "unhealthy". Verified.
    test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  frontend_blue:
    <<: *frontend
    container_name: aadml-frontend-blue
    ports:
      - "127.0.0.1:8002:80"
  frontend_green:
    <<: *frontend
    container_name: aadml-frontend-green
    ports:
      - "127.0.0.1:8003:80"
