name: Build and push image

# Runs on every push to main: tests, builds the production image, pushes it to ECR.
# On SUCCESS it chains straight into deploy.yml (`workflow_run`), so a push to main ships.
# The suite gates that: a red test run or a failed build fails here, deploy.yml's guard sees a
# non-success conclusion, and the server is never touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded builds are pointless — cancel them.
concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC — no long-lived AWS keys in GitHub

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aadml-frontend' }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      # Handed to the deploy job below so it ships exactly the image this run produced,
      # rather than re-deriving a tag and risking a mismatch.
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the image on the suite — a red build must never reach ECR.
      - name: Run tests
        run: npm test

      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ECR renders the provenance attestation as a stray untagged "unknown"
          # manifest; we do not consume it, so skip it.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Record the tag so a rollback never has to be hunted for in the log.
      - name: Summary
        run: |
          {
            echo "### Image published — deploying now"
            echo
            echo '```'
            echo "tag: ${{ steps.meta.outputs.tag }}"
            echo '```'
            echo "The **Deploy to EC2** job below ships this tag."
            echo "To roll back: Actions → *Deploy to EC2* → Run workflow → enter an older tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # Ship it. A called workflow, not a `workflow_run` chain: `needs` makes the ordering explicit
  # and puts the deploy in THIS run, so a push to main visibly builds and deploys in one place.
  # It cannot start unless `build` succeeded, so a red suite or a failed push to ECR stops here.
  deploy:
    name: Deploy
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.tag }}
    # The called workflow needs AWS_DEPLOY_ROLE_ARN for OIDC; `inherit` passes the repo secrets
    # through without re-declaring each one.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
