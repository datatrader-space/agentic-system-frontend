name: Build and push image

# Runs on every push to main: tests, builds the production image, pushes it to ECR; in parallel,
# checks the first-load JS budget and Lighthouse (`web-perf`).
# On SUCCESS of both its final job calls deploy.yml (`needs: [build, web-perf]` + `uses:`), so a push to main ships.
# The suite gates that: a red test run or a failed build fails here, the `deploy` job never
# starts, and the server is never touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Superseded builds are pointless — cancel them.
concurrency:
  group: build-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # required for AWS OIDC — no long-lived AWS keys in GitHub

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aadml-frontend' }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      # Handed to the deploy job below so it ships exactly the image this run produced,
      # rather than re-deriving a tag and risking a mismatch.
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Known-vulnerable production dependencies stop the build (security audit H-23). Only what ships
      # (--omit=dev) and only high or critical, so a low advisory in a build tool does not block a release.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Gate the image on the suite — a red build must never reach ECR.
      - name: Run tests
        run: npm test

      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # THE PUSH IS RETRIED, BECAUSE ECR DROPS UPLOAD SESSIONS AND A DROPPED ONE IS NOT A BAD BUILD.
      #
      # MEASURED, run 34892178076 (commit 679bd85): the suite passed, the image built, and the push
      # died with
      #   failed to push .../aadml-frontend:679bd85: unknown: The upload with id '4efe259d-...'
      #   in the repository with name 'aadml-frontend' ... does not exist
      # — an ECR-side layer-upload session that no longer existed by the time buildx finished with it.
      # Re-running the identical commit succeeded in 1m40s.
      #
      # The cost of not retrying is not one red tick. `deploy` is gated on this job, so the deploy was
      # skipped, nothing said so, and production served the previous frontend for nine hours while the
      # backend that its changes paired with was already live. A half-deployed pair is worse than
      # either side being old.
      #
      # Two attempts, not a loop: layers are already in the GitHub cache by the second one (which is
      # why the rerun was three times faster), and a registry that refuses twice in a row is an outage
      # worth failing on rather than hammering.
      - name: Build and push image
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ECR renders the provenance attestation as a stray untagged "unknown"
          # manifest; we do not consume it, so skip it.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A fresh ECR login too: the first attempt may have failed BECAUSE the authorization token
      # expired mid-push (they last 12 hours, but a slow build plus a retry is exactly when that
      # matters), and retrying the push with the same dead token would fail identically.
      - name: Log in to Amazon ECR (retry)
        if: steps.push.outcome == 'failure'
        id: ecr_retry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr_retry.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr_retry.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SAY WHICH ATTEMPT SHIPPED IT. A silent retry turns a recurring registry problem into folklore;
      # if this line starts appearing on every run, the retry is masking something that needs fixing.
      - name: Note the retry
        if: steps.push.outcome == 'failure'
        run: |
          echo "::warning title=ECR push retried::The first push to ECR failed and was retried. \
          If this recurs, investigate the registry rather than relying on the retry."
          echo "### Push retried" >> "$GITHUB_STEP_SUMMARY"
          echo "The first attempt failed; the second succeeded. Repeated occurrences mean the \
          registry needs attention, not a third attempt." >> "$GITHUB_STEP_SUMMARY"

      # Record the tag so a rollback never has to be hunted for in the log.
      - name: Summary
        run: |
          {
            echo "### Image published — deploying now"
            echo
            echo '```'
            echo "tag: ${{ steps.meta.outputs.tag }}"
            echo '```'
            echo "The **Deploy to EC2** job below ships this tag."
            echo "To roll back: Actions → *Deploy to EC2* → Run workflow → enter an older tag."
          } >> "$GITHUB_STEP_SUMMARY"

  # PAGE SPEED GUARDRAILS (page-speed plan Phase 6, ADM-1079; bundle report Phase 0, ADM-1072).
  # Its own job, in PARALLEL with `build`, so the image is not held up; `deploy` needs both, so a page
  # that got heavier or slower never ships. It builds the app on the runner (the image builds its own
  # copy inside Docker, without the report, so stats.html never reaches production: dist is in
  # .dockerignore and ANALYZE is unset there).
  # No AWS, no secrets: read-only permissions.
  web-perf:
    name: Bundle budget and Lighthouse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image's nginx.conf (a template; BACKEND_URL filled at start) with the previous-release mount it
      # falls back to: a syntax error fails here, and deploy needs this job.
      - name: Check the nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/prev-release"
          docker run --rm -e BACKEND_URL=127.0.0.1:8000 \
            -v "$PWD/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v "$RUNNER_TEMP/prev-release:/usr/share/nginx/prev-release:ro" \
            nginx:alpine nginx -t

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ci/lighthouse/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lighthouse CI has its own pinned manifest (ci/lighthouse), so the app's lockfile and image build
      # do not carry its ~330 packages. No install scripts: none of them needs one.
      - name: Install Lighthouse CI
        run: npm ci --prefix ci/lighthouse --ignore-scripts

      # The main app only (the Training Data page is not on any page measured below). ANALYZE=1 adds
      # rollup-plugin-visualizer (vite.config.js), which writes dist/stats.html. Then the five public pages'
      # HTML, as the image build writes it (`npm run build`, scripts/prerender.mjs).
      - name: Build with the bundle report
        env:
          ANALYZE: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vite build && node scripts/prerender.mjs

      # Fails over 200 kB gzip of first-load JS: the script index.html loads plus its modulepreloads.
      - name: First-load JS budget
        run: |
          status=0
          node scripts/check-bundle-size.mjs --json dist/bundle-size.json > bundle-size.txt 2>&1 || status=$?
          cat bundle-size.txt
          { echo "### First-load JS"; echo '```'; cat bundle-size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Uploaded even when the budget failed: that is when the treemap is needed.
      - name: Upload the bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-${{ github.sha }}
          path: |
            dist/stats.html
            dist/bundle-size.json
          retention-days: 14
          if-no-files-found: warn

      # Five pages that render signed out, served from dist by LHCI's own static server (SPA fallback,
      # gzip), no backend: their API calls get index.html instead of JSON, and each page falls back to its
      # built-in content (Pricing its static plans, Login no social buttons). Median of
      # three runs. Thresholds and pages: lighthouserc.json. Reports stay in GitHub (filesystem target),
      # never on LHCI's public storage.
      # CLS <= 0.1 is an `error` (every page passed once the cookie banner waited for the font, 2026-10-29): a
      # layout shift stops the deploy. LCP <= 2.5 s and TBT <= 200 ms (lab proxy for INP) stay `warn`: on this
      # runner's simulated phone LCP is 2.8-3.5 s on every page, and TBT has no recorded margin yet.
      - name: Lighthouse
        run: ci/lighthouse/node_modules/.bin/lhci autorun

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true      # .lighthouseci is a dot folder

  # Ship it. A called workflow, not a `workflow_run` chain: `needs` makes the ordering explicit
  # and puts the deploy in THIS run, so a push to main visibly builds and deploys in one place.
  # It cannot start unless `build` succeeded, so a red suite or a failed push to ECR stops here,
  # and unless `web-perf` passed, so a page over its size or speed budget stops here too.
  deploy:
    name: Deploy
    needs: [build, web-perf]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.tag }}
    # The called workflow needs AWS_DEPLOY_ROLE_ARN for OIDC; `inherit` passes the repo secrets
    # through without re-declaring each one.
    secrets: inherit
    permissions:
      contents: read
      id-token: write
