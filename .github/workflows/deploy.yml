name: Deploy to EC2

# AUTOMATIC on push to main: build.yml publishes the image, and this workflow ships it the
# moment that build SUCCEEDS. Chaining on `workflow_run` rather than on `push` is what makes
# it safe — a push-triggered deploy races its own build and can try to pull a tag that is not
# in ECR yet. Here the image provably exists before the pull, and a red test suite or a failed
# build never reaches the server (the guard below requires conclusion == 'success').
#
# Manual dispatch is kept for ROLLBACKS and re-deploys only:
#
#   Actions → Deploy to EC2 → Run workflow      (pick a tag, or blank for current main)
#   git deploy a84f6d2                          (alias — roll back to a known-good tag)

on:
  workflow_run:
    workflows: ["Build and push image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (blank = short SHA of the selected branch)"
        required: false
        default: ""

# Never let two deploys race the same host. Queue instead of cancelling, so a
# half-finished container swap is never abandoned.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    # Auto-runs deploy ONLY after a green build on main. A cancelled build (build.yml cancels
    # superseded runs) or a failing test suite conclude as something other than 'success', so
    # they stop here instead of shipping. Manual dispatch always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolve image tag
        id: meta
        env:
          REQUESTED: ${{ inputs.image_tag }}
          # The commit the triggering build actually produced an image for. Empty on manual
          # dispatch. Do NOT fall back to GITHUB_SHA on a workflow_run event without this —
          # for workflow_run, GITHUB_SHA points at the default branch tip, which may already
          # have moved past the commit that was built, and we would deploy a missing tag.
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-}"
          # Blank input = deploy whatever commit this workflow was dispatched
          # against, which is what `git deploy` with no argument means.
          if [ -z "$TAG" ]; then
            SHA="${BUILT_SHA:-$GITHUB_SHA}"
            TAG="${SHA:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG (trigger: $GITHUB_EVENT_NAME)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM rather than SSH: no private key lives in GitHub and port 22 stays shut
      # to the internet. deploy.sh health-gates the new container and rolls back on
      # failure, so a non-zero exit here means the site is still on the old image.
      - name: Run deploy.sh on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # Run as ubuntu, not root: SSM executes as root, and deploy.sh rewrites
          # IMAGE_TAG in .deploy.env via `sed -i`, which would leave that file
          # root-owned and break later manual `./deploy.sh` runs as ubuntu.
          PARAMS=$(jq -nc --arg c "runuser -l ubuntu -c '/opt/aadml-frontend/deploy.sh $TAG'" \
            '{commands: [$c], executionTimeout: ["900"]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy aadml-frontend $TAG" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll instead of `aws ssm wait command-executed`: that waiter gives up
          # after ~100s, but an image pull plus the health gate can exceed that.
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "--- deploy.sh stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- deploy.sh stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "final status: $STATUS"
          echo "### Deployed \`$TAG\` — status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
