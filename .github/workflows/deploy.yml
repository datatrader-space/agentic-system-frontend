name: Deploy to EC2

# MANUAL ONLY. Pushing to main builds and publishes an image (build.yml) but never
# deploys it. Shipping to production is always an explicit action:
#
#   Actions → Deploy to EC2 → Run workflow      (GitHub UI)
#   git deploy                                  (alias — deploys current main)
#   git deploy a84f6d2                          (alias — deploys/rolls back to a tag)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (blank = short SHA of the selected branch)"
        required: false
        default: ""

# Never let two deploys race the same host. Queue instead of cancelling, so a
# half-finished container swap is never abandoned.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: meta
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-}"
          # Blank input = deploy whatever commit this workflow was dispatched
          # against, which is what `git deploy` with no argument means.
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA::7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM rather than SSH: no private key lives in GitHub and port 22 stays shut
      # to the internet. deploy.sh health-gates the new container and rolls back on
      # failure, so a non-zero exit here means the site is still on the old image.
      - name: Run deploy.sh on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # Run as ubuntu, not root: SSM executes as root, and deploy.sh rewrites
          # IMAGE_TAG in .deploy.env via `sed -i`, which would leave that file
          # root-owned and break later manual `./deploy.sh` runs as ubuntu.
          PARAMS=$(jq -nc --arg c "runuser -l ubuntu -c '/opt/aadml-frontend/deploy.sh $TAG'" \
            '{commands: [$c], executionTimeout: ["900"]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy aadml-frontend $TAG" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll instead of `aws ssm wait command-executed`: that waiter gives up
          # after ~100s, but an image pull plus the health gate can exceed that.
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "--- deploy.sh stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- deploy.sh stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "final status: $STATUS"
          echo "### Deployed \`$TAG\` — status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
