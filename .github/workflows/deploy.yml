name: Deploy to EC2

# Shipping happens automatically on push to main. build.yml CALLS this workflow as its final
# job (`needs: build` + `uses:`), so the deploy runs only after the image is in ECR and the
# suite is green — no separate command, nothing to remember.
#
# It is a reusable workflow, NOT a `workflow_run` chain. Cross-workflow triggers depend on the
# file already being on the default branch, fire invisibly, and give no signal when they don't:
# a `workflow_run` version of this shipped nothing across three consecutive pushes with no
# failed run to point at. `needs:` is ordinary job ordering — it either runs in the build's own
# run, where you can see it, or the build failed.
#
# workflow_dispatch stays for ROLLBACKS: Actions → Deploy to EC2 → Run workflow, with the tag
# of a known-good build. It never fires on its own.

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag to deploy (the caller passes the tag it just built)"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (blank = short SHA of the selected branch)"
        required: false
        default: ""

# Never let two deploys race the same host. Queue instead of cancelling, so a
# half-finished container swap is never abandoned.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    # No guard needed: on the automatic path `needs: build` in the caller already means the image
    # was built and the suite was green, and a manual dispatch is an explicit human decision.
    steps:
      - name: Resolve image tag
        id: meta
        env:
          # Called by build.yml → the tag it just pushed to ECR. Manual dispatch → whatever the
          # operator typed, or blank. GITHUB_SHA is the right fallback in BOTH cases here: for a
          # reusable-workflow call it is the caller's commit, i.e. exactly the commit that was built.
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${REQUESTED:-}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_SHA:0:7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG (trigger: $GITHUB_EVENT_NAME)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM rather than SSH: no private key lives in GitHub and port 22 stays shut
      # to the internet. deploy.sh health-gates the new container and rolls back on
      # failure, so a non-zero exit here means the site is still on the old image.
      - name: Run deploy.sh on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # Run as ubuntu, not root: SSM executes as root, and deploy.sh rewrites
          # IMAGE_TAG in .deploy.env via `sed -i`, which would leave that file
          # root-owned and break later manual `./deploy.sh` runs as ubuntu.
          PARAMS=$(jq -nc --arg c "runuser -l ubuntu -c '/opt/aadml-frontend/deploy.sh $TAG'" \
            '{commands: [$c], executionTimeout: ["900"]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy aadml-frontend $TAG" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll instead of `aws ssm wait command-executed`: that waiter gives up
          # after ~100s, but an image pull plus the health gate can exceed that.
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "--- deploy.sh stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- deploy.sh stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "final status: $STATUS"
          echo "### Deployed \`$TAG\` — status: $STATUS" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "Success" ]
