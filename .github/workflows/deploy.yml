name: Build and deploy frontend

# Builds the production image in CI and pushes it to ECR, then tells the EC2 host
# to pull it. The host never runs npm install / vite build / docker build.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to EC2 after a successful build
        type: boolean
        default: true

# Never let two deploys race the same host. Queue instead of cancelling, so a
# half-finished container swap is never abandoned.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for AWS OIDC — no long-lived AWS keys in GitHub

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aadml-frontend' }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the image on the suite — a red build must never reach ECR.
      - name: Run tests
        run: npm test

      - name: Resolve image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ECR renders the provenance attestation as a stray untagged "unknown"
          # manifest; we do not consume it, so skip it.
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSM
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM rather than SSH: no private key lives in GitHub and port 22 stays shut
      # to the internet. deploy.sh health-gates the new container and rolls back on
      # failure, so a non-zero exit here means the site is still on the old image.
      - name: Run deploy.sh on the instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          set -euo pipefail

          # Run as ubuntu, not root: SSM executes as root, and deploy.sh rewrites
          # IMAGE_TAG in .deploy.env via `sed -i`, which would leave that file
          # root-owned and break later manual `./deploy.sh` runs as ubuntu.
          PARAMS=$(jq -nc --arg c "runuser -l ubuntu -c '/opt/aadml-frontend/deploy.sh $TAG'" \
            '{commands: [$c], executionTimeout: ["900"]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy aadml-frontend $TAG" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          # Poll instead of `aws ssm wait command-executed`: that waiter gives up
          # after ~100s, but an image pull plus the health gate can exceed that.
          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "--- deploy.sh stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- deploy.sh stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]
